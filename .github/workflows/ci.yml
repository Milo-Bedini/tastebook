name: CI

on:
  pull_request:
  # GitHub's merge queue builds each queued PR on top of main and the PRs ahead of it, and waits for these checks.
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DJANGO_DEBUG: "true"
  DATABASE_URL: postgres://tastebook:tastebook@localhost:5432/tastebook

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - uses: $/.github/actions/playwright-chromium
        with:
          save-cache: true
      # Vitest only warns when Vite reloads a story test for a dependency it found late, and the reload fails the
      # story tests intermittently, so the warning fails the step. GitHub's bash shell sets pipefail, so a test failure
      # still fails it through tee.
      - name: pnpm test
        shell: bash
        run: |
          pnpm test 2>&1 | tee "$RUNNER_TEMP/test.log"
          if grep -qF 'Vite unexpectedly reloaded a test' "$RUNNER_TEMP/test.log"; then
            echo "::error::Vite unexpectedly reloaded a test: add the dependency it optimised to the storybook project's optimizeDeps.include in frontend/vitest.config.ts."
            exit 1
          fi
      - run: pnpm build
      - run: pnpm --filter frontend build-storybook
      - run: pnpm --filter frontend test:visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-report
          path: |
            frontend/playwright-report/visual
            frontend/test-results/visual
          retention-days: 14

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tastebook
          POSTGRES_PASSWORD: tastebook
          POSTGRES_DB: tastebook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tastebook"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the OpenAPI schema
        working-directory: backend
        run: uv run python manage.py spectacular --validate --fail-on-warn --file schema.yml
      - run: pnpm generate:api
      - name: Fail if the schema or the frontend types are stale
        run: |
          if ! git diff --exit-code -- backend/schema.yml frontend/src/api/schema.d.ts; then
            echo "::error::Run 'uv run python manage.py spectacular --file schema.yml' in backend/ and 'pnpm generate:api', then commit the result."
            exit 1
          fi

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @tastebook/workflows
      # zizmor, then the secrets check; --offline keeps zizmor off the GitHub API, so the job needs no token.
      - run: pnpm lint:workflows

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tastebook
          POSTGRES_PASSWORD: tastebook
          POSTGRES_DB: tastebook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tastebook"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: backend
      - run: uv run python manage.py migrate --noinput
        working-directory: backend
      # Previews always have the catalogue, so the specs must pass with recipes in the database, not only without.
      - run: uv run python manage.py load_catalogue
        working-directory: backend
      - uses: $/.github/actions/playwright-chromium
        with:
          save-cache: true
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
