name: Mutation testing

# Mutation-tests the source files changed on main since a date, at most two a side, and times each side. Each side's
# command stops at a time limit that leaves its job time to upload, and its summary then says "complete": false and
# how many of the mutants it tested. Runs every Monday at 04:30 UTC, an hour or more before the factory's weekly
# clean-up, which reads each side's summary from the run's mutation-frontend and mutation-backend artifacts; it can
# also be run by hand.
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: Mutate the source files changed on main since (any date git rev-list --before takes)
        default: 7 days ago

permissions:
  contents: read

concurrency:
  group: mutation-testing
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List the files changed on main
        id: files
        env:
          SINCE: ${{ inputs.since || '7 days ago' }}
        run: |
          # Diff main as it was at SINCE (the empty tree before main's first commit) against main now, so a PR merged
          # in the window counts whenever its commits were written. Deleted files are dropped and the rest listed by
          # lines changed (added plus deleted; a binary file's "-" counts as 0), most first: each command skips what
          # isn't its own source, then keeps the first --max-files.
          from=$(git rev-list -1 --first-parent --before="$SINCE" origin/main)
          from=${from:-$(git hash-object -t tree /dev/null)}
          files=$(git -c core.quotePath=false diff --numstat --no-renames --diff-filter=d "$from" origin/main \
            | awk -F '\t' -v OFS='\t' '{ print ($1 == "-" ? 0 : $1) + ($2 == "-" ? 0 : $2), $3 }' \
            | sort -t "$(printf '\t')" -k1,1nr -s \
            | cut -f 2-)
          echo "Changed since $SINCE: $(printf '%s' "$files" | grep -c . || true) files"
          {
            echo 'files<<EOF'
            printf '%s\n' "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: changes
    runs-on: ubuntu-latest
    # A backstop: the command's --time-limit stops it first. A side that runs out of time uploads no summary, which the
    # clean-up reports as a gap.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutation-test the changed files
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.files }}
        run: |
          mapfile -t files <<< "$CHANGED_FILES"
          # Setup takes under a minute, leaving about 10 for Stryker to stop and the upload.
          pnpm mutation:frontend --out mutation-frontend.json --max-files 2 --time-limit 40 "${files[@]}"
      - name: Upload the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-frontend
          path: mutation-frontend.json
      - name: Summarise
        if: ${{ !cancelled() && hashFiles('mutation-frontend.json') != '' }}
        run: jq -r --arg side Frontend -f .github/mutation-summary.jq mutation-frontend.json >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend
    needs: changes
    runs-on: ubuntu-latest
    # A backstop: the command's --time-limit stops it first. A side that runs out of time uploads no summary, which the
    # clean-up reports as a gap.
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tastebook
          POSTGRES_PASSWORD: tastebook
          POSTGRES_DB: tastebook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tastebook"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://tastebook:tastebook@localhost:5432/tastebook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the harness tells a noticed mutant from an unnoticed one
        env:
          KNOWN_MUTANTS: backend/mutation_check/known_mutants.py
        run: |
          # A harness that counts every mutant as killed (as when mutants' runs shared one test database) or every
          # mutant as survived would make the real run's summary meaningless, so it's checked on known mutants first.
          pnpm mutation:backend --out mutation-check.json "$KNOWN_MUTANTS"
          expected=$(grep -n '# unnoticed$' "$KNOWN_MUTANTS" | cut -d: -f1 | jq -sc 'unique')
          reported=$(jq -c --arg file "$KNOWN_MUTANTS" \
            '[.survivors[] | select(.file == $file and .status == "survived") | .line]' mutation-check.json)
          if [ "$reported" != "$expected" ]; then
            echo "::error::$KNOWN_MUTANTS's unnoticed mutants should be reported survived on lines $expected, not $reported: the harness counts mutants no test noticed as killed, or the reverse."
            exit 1
          fi
          if ! jq -e '.mutants > (.survivors | length)' mutation-check.json > /dev/null; then
            echo "::error::No mutant of $KNOWN_MUTANTS was reported killed, though its tests notice all but those marked unnoticed."
            exit 1
          fi
      - name: Mutation-test the changed files
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.files }}
        run: |
          mapfile -t files <<< "$CHANGED_FILES"
          # The harness check before takes about 10 minutes, leaving about 10 for mutmut to stop and the upload.
          pnpm mutation:backend --out mutation-backend.json --max-files 2 --time-limit 30 "${files[@]}"
      - name: Upload the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-backend
          path: mutation-backend.json
      - name: Summarise
        if: ${{ !cancelled() && hashFiles('mutation-backend.json') != '' }}
        run: jq -r --arg side Backend -f .github/mutation-summary.jq mutation-backend.json >> "$GITHUB_STEP_SUMMARY"
