name: Mutation testing

# Mutation-tests the source files changed on main since a date, and times each side. Run by hand; the factory's
# weekly clean-up calls the same two commands.
on:
  workflow_dispatch:
    inputs:
      since:
        description: Mutate the source files changed on main since (any date git rev-list --before takes)
        default: 7 days ago

permissions:
  contents: read

concurrency:
  group: mutation-testing
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List the files changed on main
        id: files
        env:
          SINCE: ${{ inputs.since || '7 days ago' }}
        run: |
          # Diff main as it was at SINCE against main now, so a PR merged in the window counts whenever its commits
          # were written. Each command skips what isn't its own source, so the list only drops deleted files.
          from=$(git rev-list -1 --first-parent --before="$SINCE" origin/main)
          if [ -n "$from" ]; then
            files=$(git diff --name-only --diff-filter=d "$from" origin/main)
          else
            files=$(git ls-tree -r --name-only origin/main)
          fi
          echo "Changed since $SINCE: $(printf '%s' "$files" | grep -c . || true) files"
          {
            echo 'files<<EOF'
            printf '%s\n' "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutation-test the changed files
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.files }}
        run: |
          mapfile -t files <<< "$CHANGED_FILES"
          pnpm mutation:frontend --out mutation-frontend.json "${files[@]}"
      - name: Summarise
        if: ${{ !cancelled() && hashFiles('mutation-frontend.json') != '' }}
        run: jq -r --arg side Frontend -f .github/mutation-summary.jq mutation-frontend.json >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tastebook
          POSTGRES_PASSWORD: tastebook
          POSTGRES_DB: tastebook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tastebook"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://tastebook:tastebook@localhost:5432/tastebook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the harness tells a noticed mutant from an unnoticed one
        env:
          KNOWN_MUTANTS: backend/mutation_check/known_mutants.py
        run: |
          # A harness that counts every mutant as killed (as when mutants' runs shared one test database) or every
          # mutant as survived would make the real run's summary meaningless, so it's checked on known mutants first.
          pnpm mutation:backend --out mutation-check.json "$KNOWN_MUTANTS"
          expected=$(grep -n '# unnoticed$' "$KNOWN_MUTANTS" | cut -d: -f1 | jq -sc 'unique')
          reported=$(jq -c --arg file "$KNOWN_MUTANTS" \
            '[.survivors[] | select(.file == $file and .status == "survived") | .line] | unique' mutation-check.json)
          if [ "$reported" != "$expected" ]; then
            echo "::error::$KNOWN_MUTANTS's unnoticed mutants should be reported survived on lines $expected, not $reported: the harness counts mutants no test noticed as killed, or the reverse."
            exit 1
          fi
          if ! jq -e '.mutants > (.survivors | length)' mutation-check.json > /dev/null; then
            echo "::error::No mutant of $KNOWN_MUTANTS was reported killed, though its tests notice all but those marked unnoticed."
            exit 1
          fi
      - name: Mutation-test the changed files
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.files }}
        run: |
          mapfile -t files <<< "$CHANGED_FILES"
          pnpm mutation:backend --out mutation-backend.json "${files[@]}"
      - name: Summarise
        if: ${{ !cancelled() && hashFiles('mutation-backend.json') != '' }}
        run: jq -r --arg side Backend -f .github/mutation-summary.jq mutation-backend.json >> "$GITHUB_STEP_SUMMARY"
