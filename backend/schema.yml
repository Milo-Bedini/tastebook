openapi: 3.0.3
info:
  title: Tastebook API
  version: 0.1.0
  description: Recipe hub API
paths:
  /api/account/:
    get:
      operationId: current_account_retrieve
      description: The account signed in on this browser, or null when nobody is.
      tags:
      - account
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccount'
          description: ''
    patch:
      operationId: current_account_partial_update
      description: Saves the signed-in account's name, unit system or both. An account
        with no household gets one called "<name>'s household"; a later name leaves
        the household's name as it is.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountChanges'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountChanges'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountChanges'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '400':
          description: No response body
        '403':
          description: No response body
  /api/courses/:
    get:
      operationId: courses_list
      tags:
      - courses
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
          description: ''
  /api/cuisines/:
    get:
      operationId: cuisines_list
      tags:
      - cuisines
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cuisine'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/household/:
    get:
      operationId: household_retrieve
      description: 'The signed-in account''s household: its name and its members,
        the account first. 404 for an account with no household yet.'
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
    patch:
      operationId: household_partial_update
      description: Renames the signed-in account's household. Any member may.
      tags:
      - household
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdChanges'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdChanges'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdChanges'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '400':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/household/invite/:
    post:
      operationId: household_invite_create
      description: 'The signed-in account''s household with a live invite link: the
        one it has, or a new one that works for 7 days when it has none or only an
        expired one. Any member may.'
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
    delete:
      operationId: household_invite_destroy
      description: Cancels the signed-in account's household's invite link, live or
        expired, and answers the household. Any member may; cancelling when there
        is none does nothing.
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
  /api/household/leave/:
    post:
      operationId: household_leave_create
      description: Moves the signed-in account into a new household of one, named
        after it, with a copy of each private recipe it wrote; the household it left
        keeps its own. A household left with nobody in it is deleted.
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
  /api/household/members/{member_id}/:
    delete:
      operationId: household_members_destroy
      description: Removes another member of the signed-in account's household into
        a new household of one, with a copy of each private recipe they wrote (the
        household keeps its own), and emails them. Any member may. 404 for anyone
        who isn't another member of it.
      parameters:
      - in: path
        name: member_id
        schema:
          type: integer
        required: true
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
  /api/ingredients/:
    get:
      operationId: ingredients_list
      tags:
      - ingredients
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngredientOption'
          description: ''
  /api/invites/{token}/:
    get:
      operationId: invite_retrieve
      description: Whether an invite link works and, for someone signed in, the household
        it joins. 404 for a token that was never an invite.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - invites
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinInvite'
          description: ''
        '404':
          description: No response body
  /api/invites/{token}/join/:
    post:
      operationId: invite_join_create
      description: Moves the signed-in account into the invite's household with a
        copy of each private recipe it wrote; the household it left keeps its own,
        and is deleted if nobody is left in it. 404 for an unknown token, 409 when
        the link is cancelled or expired.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - invites
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/recipes/:
    get:
      operationId: recipes_list
      parameters:
      - in: query
        name: course
        schema:
          type: array
          items:
            type: string
        description: Recipes with any of these courses, by slug. Unknown slugs are
          dropped; with none left, nothing is filtered.
      - in: query
        name: cuisine
        schema:
          type: array
          items:
            type: string
        description: Recipes with any of these cuisines, by slug. Unknown slugs are
          dropped; with none left, nothing is filtered.
      - in: query
        name: diet
        schema:
          type: array
          items:
            enum:
            - vegetarian
            - vegan
            - gluten_free
            - dairy_free
            type: string
            description: |-
              * `vegetarian` - Vegetarian
              * `vegan` - Vegan
              * `gluten_free` - Gluten-free
              * `dairy_free` - Dairy-free
        description: Recipes with every one of these diet tags, worked out as each
          recipe's diet_tags are. Any other value is a 400.
      - in: query
        name: difficulty
        schema:
          type: array
          items:
            enum:
            - easy
            - medium
            - hard
            type: string
            description: |-
              * `easy` - Easy
              * `medium` - Medium
              * `hard` - Hard
        description: Recipes with any of these difficulties. Any other value is a
          400.
      - in: query
        name: exclude_ingredient
        schema:
          type: array
          items:
            type: string
        description: Recipes with no line, optional or not, using any of these ingredients,
          by slug. Unknown slugs exclude nothing.
      - in: query
        name: include_ingredient
        schema:
          type: array
          items:
            type: string
        description: Recipes with a line, optional or not, using any of these ingredients
          (every one with include_match=all), by slug. Unknown slugs are dropped;
          with none left, nothing is filtered.
      - in: query
        name: include_match
        schema:
          enum:
          - any
          - all
          type: string
          default: any
          minLength: 1
        description: |-
          any (or missing) means a recipe needs one of the include_ingredient ingredients; all means it needs every one of them. Any other value is a 400.

          * `any` - any
          * `all` - all
      - in: query
        name: max_cook
        schema:
          type: integer
          minimum: 1
        description: Cook time is this many minutes or fewer. A value that is not
          a whole number of at least 1 is a 400.
      - in: query
        name: max_prep
        schema:
          type: integer
          minimum: 1
        description: Prep time is this many minutes or fewer. A value that is not
          a whole number of at least 1 is a 400.
      - in: query
        name: max_total
        schema:
          type: integer
          minimum: 1
        description: Prep plus cook plus extra time is this many minutes or fewer.
          A value that is not a whole number of at least 1 is a 400.
      - in: query
        name: one_pot
        schema:
          type: boolean
          default: false
        description: true means only one-pot recipes; false or missing means every
          recipe.
      - in: query
        name: q
        schema:
          type: string
          default: ''
        description: Title, description, an ingredient's name or synonym, or a cuisine
          contains this text, ignoring case and accents. Title matches come first,
          then the others, alphabetically within each.
      tags:
      - recipes
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeSummary'
          description: ''
        '400':
          description: A difficulty, a diet, an include_match or a time limit is not
            one the list accepts.
    post:
      operationId: recipes_create
      description: Adds a private recipe to the signed-in account's household. Only
        the title is required. 403 when signed out or for an account with no household
        yet.
      tags:
      - recipes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRecipe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewRecipe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewRecipe'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '400':
          description: A field, or a pair of them, is not one a recipe can hold.
        '403':
          description: Signed out, or the account has no household yet.
  /api/recipes/{slug}/:
    get:
      operationId: recipes_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '404':
          description: No recipe has this slug, or it's another household's.
    patch:
      operationId: recipes_partial_update
      description: Edits a recipe of the signed-in account's household; any member
        may, whoever wrote it. Only the fields sent change, and the address stays
        as it is.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRecipeChanges'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRecipeChanges'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRecipeChanges'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '400':
          description: A field, or a pair of them, is not one a recipe can hold.
        '403':
          description: Signed out, or the account has no household yet.
        '404':
          description: 'No recipe has this slug in the account''s household: there''s
            none, it''s another household''s, or it''s a catalogue recipe.'
  /api/test-accounts/code/:
    get:
      operationId: test_account_code_retrieve
      description: The latest sign-in code of a test account at tastebook.test. Local
        runs and previews only; 404 on production.
      parameters:
      - in: query
        name: email
        schema:
          type: string
        required: true
      tags:
      - test-accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInCode'
          description: ''
        '404':
          description: No response body
  /api/test-accounts/seed/:
    post:
      operationId: test_account_seed_create
      description: Makes test accounts at tastebook.test in new households, with the
        private recipes each wrote, and answers a signed-in session for each. Local
        runs and previews only; 404 on production.
      tags:
      - test-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Seed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Seed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Seed'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seeded'
          description: ''
        '400':
          description: A field, a repeated key, or a recipe the database cannot hold;
            nothing is saved.
        '404':
          description: No response body
components:
  schemas:
    Account:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        unit_system:
          $ref: '#/components/schemas/UnitSystem'
      required:
      - email
      - name
      - unit_system
    BlankEnum:
      enum:
      - ''
    Course:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - name
      - slug
    Cuisine:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - name
      - slug
    CurrentAccount:
      type: object
      properties:
        account:
          allOf:
          - $ref: '#/components/schemas/Account'
          nullable: true
      required:
      - account
    DatabaseEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    DietTag:
      enum:
      - vegetarian
      - vegan
      - gluten_free
      - dairy_free
      type: string
      description: |-
        * `vegetarian` - Vegetarian
        * `vegan` - Vegan
        * `gluten_free` - Gluten-free
        * `dairy_free` - Dairy-free
    DietTagConflict:
      type: object
      properties:
        ingredient:
          allOf:
          - $ref: '#/components/schemas/Ingredient'
          readOnly: true
        diet_tags:
          type: array
          items:
            $ref: '#/components/schemas/DietTag'
          readOnly: true
      required:
      - diet_tags
      - ingredient
    DifficultyEnum:
      enum:
      - easy
      - medium
      - hard
      type: string
      description: |-
        * `easy` - Easy
        * `medium` - Medium
        * `hard` - Hard
    Equipment:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - name
      - slug
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        database:
          $ref: '#/components/schemas/DatabaseEnum'
        version:
          type: string
      required:
      - database
      - status
      - version
    HealthStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    Household:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        invite:
          allOf:
          - $ref: '#/components/schemas/Invite'
          nullable: true
      required:
      - id
      - invite
      - members
      - name
    Ingredient:
      type: object
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: 'The UK name: courgette, coriander, plain flour.'
          maxLength: 100
        grams_per_cup:
          type: integer
          readOnly: true
          nullable: true
      required:
      - grams_per_cup
      - name
      - slug
    IngredientGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: '"For the sauce", "To serve".'
          maxLength: 100
        lines:
          type: array
          items:
            $ref: '#/components/schemas/IngredientLine'
          readOnly: true
      required:
      - id
      - lines
      - name
    IngredientLine:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        amount:
          type: number
          format: double
          maximum: 100000
          minimum: -100000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        amount_max:
          type: number
          format: double
          maximum: 100000
          minimum: -100000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        unit:
          description: |-
            Leave empty for "2 eggs".

            * `g` - g
            * `kg` - kg
            * `ml` - ml
            * `l` - l
            * `tsp` - tsp
            * `tbsp` - tbsp
            * `cup` - cup
            * `oz` - oz
            * `lb` - lb
            * `fl_oz` - fl oz
            * `pinch` - pinch
            * `clove` - clove
            * `tin` - tin
            * `slice` - slice
            * `bunch` - bunch
            * `handful` - handful
          oneOf:
          - $ref: '#/components/schemas/UnitEnum'
          - $ref: '#/components/schemas/BlankEnum'
        ingredient:
          allOf:
          - $ref: '#/components/schemas/Ingredient'
          readOnly: true
        note:
          type: string
          description: '"finely chopped".'
          maxLength: 200
        optional:
          type: boolean
        original_text:
          type: string
          title: Original wording
          description: The line as the recipe was written.
          maxLength: 300
      required:
      - amount
      - amount_max
      - id
      - ingredient
      - note
      - optional
      - original_text
      - unit
    IngredientOption:
      type: object
      description: An ingredient as the filters offer it, with the synonyms it can
        be found by.
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: 'The UK name: courgette, coriander, plain flour.'
          maxLength: 100
        synonyms:
          type: array
          items:
            type: string
            description: 'Another name, such as the US one: zucchini.'
          readOnly: true
      required:
      - name
      - slug
      - synonyms
    Invite:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/InviteStatus'
      required:
      - expires_at
      - status
      - token
    InviteStatus:
      enum:
      - live
      - expired
      - cancelled
      type: string
      description: |-
        * `live` - Live
        * `expired` - Expired
        * `cancelled` - Cancelled
    InvitedHousehold:
      type: object
      properties:
        name:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
      required:
      - members
      - name
    JoinInvite:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/InviteStatus'
        is_member:
          type: boolean
        household:
          allOf:
          - $ref: '#/components/schemas/InvitedHousehold'
          nullable: true
        recipes_to_copy:
          type: integer
          description: How many private recipes the viewer wrote in their household
            and would take a copy of by joining. 0 when the link offers them no household
            to join.
      required:
      - household
      - is_member
      - recipes_to_copy
      - status
    Member:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_you:
          type: boolean
      required:
      - id
      - is_you
      - name
    NewRecipe:
      type: object
      description: What the form sends to add a recipe. Only the title is required.
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 300
        cuisines:
          type: array
          items:
            type: string
        courses:
          type: array
          items:
            type: string
        difficulty:
          oneOf:
          - $ref: '#/components/schemas/DifficultyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        prep_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        cook_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        extra_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Waiting time, such as marinating or proving.
        extra_label:
          type: string
          description: What the extra time is for, such as marinating, resting or
            proving.
          maxLength: 50
        servings:
          type: integer
          maximum: 32767
          minimum: 1
          nullable: true
          description: Leave empty when giving a yield.
        yield_amount:
          type: integer
          maximum: 32767
          minimum: 1
          nullable: true
          description: '"12" in "makes 12 cookies".'
        yield_unit:
          type: string
          description: '"cookies" in "makes 12 cookies".'
          maxLength: 50
        one_pot:
          type: boolean
        source:
          type: string
          title: Source credit
          description: 'Where the recipe came from: an author, a website or a book.'
          maxLength: 300
        source_url:
          title: Source address
          description: The original recipe's page, which the source credit links to.
            Leave empty when there is none.
