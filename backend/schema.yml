          items:
            type: string
            maxLength: 200
          description: Titles of this member's own public recipes that staff have
            restored, as if after an earlier report, once every share is made and
            before anyone's reports, so a report leaves them up.
          maxItems: 20
        removed:
          type: array
          items:
            type: string
            maxLength: 200
          description: 'Titles of this member''s own recipes that staff have removed
            from public view, as if after an earlier report, once every restore is
            made: each is private, and its author can''t make it public again.'
          maxItems: 20
        reports:
          type: array
          items:
            type: string
            maxLength: 200
          description: Titles of other households' public recipes this member reports
            as spam, last of all, as saves name them. The first report of a recipe
            that is not restored hides it from everyone but its author.
          maxItems: 20
      required:
      - key
      - name
    Seeded:
      type: object
      properties:
        session_cookie:
          type: string
        accounts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SeededAccount'
      required:
      - accounts
      - session_cookie
    SeededAccount:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        session:
          type: string
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/SeededRecipe'
      required:
      - email
      - name
      - recipes
      - session
    SeededRecipe:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        share_token:
          type: string
          nullable: true
          description: The token of its share link, which /shared/<token> opens; null
            when it's off.
      required:
      - share_token
      - slug
      - title
    SharedRecipe:
      type: object
      description: |-
        A recipe as its share link shows it to anyone: the recipe itself, and nothing of the household's (no author,
        no copy's original, nothing only a member may do).
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 300
        cuisines:
          type: array
          items:
            $ref: '#/components/schemas/Cuisine'
          readOnly: true
        courses:
          type: array
          items:
            $ref: '#/components/schemas/Course'
          readOnly: true
        difficulty:
          oneOf:
          - $ref: '#/components/schemas/DifficultyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        total_minutes:
          type: integer
          readOnly: true
          nullable: true
        prep_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        cook_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        extra_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Waiting time, such as marinating or proving.
        extra_label:
          type: string
          description: What the extra time is for, such as marinating, resting or
            proving.
          maxLength: 50
        servings:
          type: integer
          maximum: 32767
          minimum: 1
          nullable: true
          description: Leave empty when giving a yield.
        yield_amount:
          type: integer
          maximum: 32767
          minimum: 1
          nullable: true
          description: '"12" in "makes 12 cookies".'
        yield_unit:
          type: string
          description: '"cookies" in "makes 12 cookies".'
          maxLength: 50
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'
          readOnly: true
        one_pot:
          type: boolean
        source:
          type: string
          title: Source credit
          description: 'Where the recipe came from: an author, a website or a book.'
          maxLength: 300
        source_url:
          title: Source address
          description: The original recipe's page, which the source credit links to.
            Leave empty when there is none.
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        original_source:
          type: string
          readOnly: true
          description: A catalogue original's source credit, with its licence, which
            a copy of it keeps and can't edit; '' for any other recipe.
        original_source_url:
          type: string
          readOnly: true
          description: The page original_source links to, or '' when there is none.
        photo:
          allOf:
          - $ref: '#/components/schemas/RecipePhoto'
          readOnly: true
          nullable: true
        diet_tags:
          type: array
          items:
            $ref: '#/components/schemas/DietTag'
          readOnly: true
        ingredient_lines:
          type: array
          items:
            $ref: '#/components/schemas/IngredientLine'
          readOnly: true
        ingredient_groups:
          type: array
          items:
            $ref: '#/components/schemas/IngredientGroup'
          readOnly: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
          readOnly: true
        diet_tag_conflicts:
          type: array
          items:
            $ref: '#/components/schemas/DietTagConflict'
          readOnly: true
      required:
      - cook_minutes
      - courses
      - cuisines
      - description
      - diet_tag_conflicts
      - diet_tags
      - difficulty
      - equipment
      - extra_label
      - extra_minutes
      - id
      - ingredient_groups
      - ingredient_lines
      - one_pot
      - original_source
      - original_source_url
      - photo
      - prep_minutes
      - servings
      - source
      - source_url
      - steps
      - title
      - total_minutes
      - yield_amount
      - yield_unit
    SignInCode:
      type: object
      properties:
        code:
          type: string
      required:
      - code
    Step:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
      required:
      - id
      - text
    Undo:
      type: object
      properties:
        undo:
          type: string
          description: Puts the recipe back where it was, for an hour.
      required:
      - undo
    UnitEnum:
      enum:
      - g
      - kg
      - ml
      - l
      - tsp
      - tbsp
      - cup
      - oz
      - lb
      - fl_oz
      - pinch
      - clove
      - tin
      - slice
      - bunch
      - handful
      type: string
      description: |-
        * `g` - g
        * `kg` - kg
        * `ml` - ml
        * `l` - l
        * `tsp` - tsp
        * `tbsp` - tbsp
        * `cup` - cup
        * `oz` - oz
        * `lb` - lb
        * `fl_oz` - fl oz
        * `pinch` - pinch
        * `clove` - clove
        * `tin` - tin
        * `slice` - slice
        * `bunch` - bunch
        * `handful` - handful
    UnitSystem:
      enum:
      - metric
      - us
      type: string
      description: |-
        * `metric` - Metric
        * `us` - US customary
    Visibility:
      enum:
      - public
      - private
      type: string
      description: |-
        * `public` - Public
        * `private` - Private
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
