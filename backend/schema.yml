          description: 'The slug of a recipe the account can see: a public recipe,
            or its household''s own.'
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - recipe
    SavedList:
      type: object
      properties:
        slug:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        saved_recipes:
          type: array
          items:
            $ref: '#/components/schemas/SavedRecipe'
          readOnly: true
          description: Newest saved first.
      required:
      - name
      - saved_recipes
      - slug
    SavedRecipe:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
          description: The title the recipe had when it was saved.
        saved_at:
          type: string
          format: date-time
          readOnly: true
        recipe:
          allOf:
          - $ref: '#/components/schemas/ListedRecipe'
          readOnly: true
          nullable: true
          description: 'null once the recipe is unavailable: its author made it private
            or deleted it.'
      required:
      - id
      - recipe
      - saved_at
      - title
    Seed:
      type: object
      properties:
        households:
          type: array
          items:
            $ref: '#/components/schemas/SeedHousehold'
      required:
      - households
    SeedHousehold:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        members:
          type: array
          items:
            $ref: '#/components/schemas/SeedMember'
      required:
      - members
    SeedMember:
      type: object
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,19}$
        name:
          type: string
          maxLength: 50
        unit_system:
          allOf:
          - $ref: '#/components/schemas/UnitSystem'
          description: |-
            metric when not given.

            * `metric` - Metric
            * `us` - US customary
        added_ingredients:
          type: array
          items:
            type: string
            maxLength: 100
          description: Ingredients this member adds, awaiting review, before their
            recipes are made; their recipes may name them.
          maxItems: 20
        recipes:
          type: array
          items:
            type: object
            additionalProperties: {}
          maxItems: 20
        saves:
          type: array
          items:
            type: string
            maxLength: 200
          description: 'Titles of the recipes this member saves to Favourites, oldest
            first, once every member''s recipes are made: a recipe a member of this
            seed wrote, or a catalogue recipe. Each must be one the member can see.'
          maxItems: 20
      required:
      - key
      - name
    Seeded:
      type: object
      properties:
        session_cookie:
          type: string
        accounts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SeededAccount'
      required:
      - accounts
      - session_cookie
    SeededAccount:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        session:
          type: string
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/SeededRecipe'
      required:
      - email
      - name
      - recipes
      - session
    SeededRecipe:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
      required:
      - slug
      - title
    SignInCode:
      type: object
      properties:
        code:
          type: string
      required:
      - code
    Step:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
      required:
      - id
      - text
    Undo:
      type: object
      properties:
        undo:
          type: string
          description: Puts the recipe back where it was, for an hour.
      required:
      - undo
    UnitEnum:
      enum:
      - g
      - kg
      - ml
      - l
      - tsp
      - tbsp
      - cup
      - oz
      - lb
      - fl_oz
      - pinch
      - clove
      - tin
      - slice
      - bunch
      - handful
      type: string
      description: |-
        * `g` - g
        * `kg` - kg
        * `ml` - ml
        * `l` - l
        * `tsp` - tsp
        * `tbsp` - tbsp
        * `cup` - cup
        * `oz` - oz
        * `lb` - lb
        * `fl_oz` - fl oz
        * `pinch` - pinch
        * `clove` - clove
        * `tin` - tin
        * `slice` - slice
        * `bunch` - bunch
        * `handful` - handful
    UnitSystem:
      enum:
      - metric
      - us
      type: string
      description: |-
        * `metric` - Metric
        * `us` - US customary
    Visibility:
      enum:
      - public
      - private
      type: string
      description: |-
        * `public` - Public
        * `private` - Private
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
