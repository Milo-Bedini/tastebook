openapi: 3.0.3
info:
  title: Tastebook API
  version: 0.1.0
  description: Recipe hub API
paths:
  /api/account/:
    get:
      operationId: current_account_retrieve
      description: The account signed in on this browser, or null when nobody is.
      tags:
      - account
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccount'
          description: ''
    patch:
      operationId: current_account_partial_update
      description: Saves the signed-in account's name, unit system or both. An account
        with no household gets one called "<name>'s household"; a later name leaves
        the household's name as it is.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountChanges'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountChanges'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountChanges'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '400':
          description: No response body
        '403':
          description: No response body
  /api/courses/:
    get:
      operationId: courses_list
      tags:
      - courses
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
          description: ''
  /api/cuisines/:
    get:
      operationId: cuisines_list
      tags:
      - cuisines
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cuisine'
          description: ''
  /api/equipment/:
    get:
      operationId: equipment_list
      tags:
      - equipment
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Equipment'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/household/:
    get:
      operationId: household_retrieve
      description: 'The signed-in account''s household: its name and its members,
        the account first. 404 for an account with no household yet.'
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
    patch:
      operationId: household_partial_update
      description: Renames the signed-in account's household. Any member may.
      tags:
      - household
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdChanges'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdChanges'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdChanges'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '400':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/household/invite/:
    post:
      operationId: household_invite_create
      description: 'The signed-in account''s household with a live invite link: the
        one it has, or a new one that works for 7 days when it has none or only an
        expired one. Any member may.'
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
    delete:
      operationId: household_invite_destroy
      description: Cancels the signed-in account's household's invite link, live or
        expired, and answers the household. Any member may; cancelling when there
        is none does nothing.
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
  /api/household/leave/:
    post:
      operationId: household_leave_create
      description: Moves the signed-in account into a new household of one, named
        after it, with a copy of each private recipe it wrote; the household it left
        keeps its own. A household left with nobody in it is deleted.
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
  /api/household/members/{member_id}/:
    delete:
      operationId: household_members_destroy
      description: Removes another member of the signed-in account's household into
        a new household of one, with a copy of each private recipe they wrote (the
        household keeps its own), and emails them. Any member may. 404 for anyone
        who isn't another member of it.
      parameters:
      - in: path
        name: member_id
        schema:
          type: integer
        required: true
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
  /api/ingredients/:
    get:
      operationId: ingredients_list
      description: Every ingredient but those awaiting review; a household is also
        offered the ones its recipes use.
      tags:
      - ingredients
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngredientOption'
          description: ''
    post:
      operationId: ingredients_create
      description: Gives the ingredient with this name or synonym, ignoring case and
        accents (200), or adds one awaiting review (201). 403 when signed out or for
        an account with no household yet.
      tags:
      - ingredients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewIngredient'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewIngredient'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewIngredient'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientOption'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientOption'
          description: ''
        '400':
          description: The name is blank, has no letter or is over 100 characters.
        '403':
          description: Signed out, or the account has no household yet.
  /api/invites/{token}/:
    get:
      operationId: invite_retrieve
      description: Whether an invite link works and, for someone signed in, the household
        it joins. 404 for a token that was never an invite.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - invites
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinInvite'
          description: ''
        '404':
          description: No response body
  /api/invites/{token}/join/:
    post:
      operationId: invite_join_create
      description: Moves the signed-in account into the invite's household with a
        copy of each private recipe it wrote; the household it left keeps its own,
        and is deleted if nobody is left in it. 404 for an unknown token, 409 when
        the link is cancelled or expired.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - invites
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/lists/:
    get:
      operationId: lists_list
      description: 'The lists the signed-in account sees: Favourites, even before
        anything is saved to it, its own lists and its household''s, with its household''s
        name.'
      tags:
      - lists
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lists'
          description: ''
        '403':
          description: Signed out.
    post:
      operationId: lists_create
      description: Makes an empty list, the account's own or its household's, at an
        address made from its name.
      tags:
      - lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewList'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewList'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewList'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedList'
          description: ''
        '400':
          description: The name is missing, too long, "Favourites", or the name of
            another of the owner's lists. Or a household list for an account with
            no household.
        '403':
          description: Signed out.
  /api/lists/{slug}/:
    get:
      operationId: lists_retrieve
      description: One of the signed-in account's own lists, Favourites among them,
        newest saved first. A recipe its author has since made private or deleted
        keeps its place with the title it was saved with and no recipe.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - lists
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedList'
          description: ''
        '403':
          description: Signed out.
        '404':
          description: 'The account has no list with this slug, of its own or its
            household''s: there''s none, it''s been deleted or renamed, or it''s another
            account''s or household''s.'
    patch:
      operationId: lists_partial_update
      description: Renames one of the signed-in account's own lists, Favourites among
        them; its slug follows the new name.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedListName'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedListName'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedListName'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedList'
          description: ''
        '400':
          description: The name is missing, too long, "Favourites", or the name of
            another of the owner's lists.
        '403':
          description: Signed out.
        '404':
          description: As for GET, and Favourites, which is never renamed or deleted.
    delete:
      operationId: lists_destroy
      description: Deletes one of the signed-in account's own lists, Favourites among
        them. Its recipes stay in Tastebook and in any other list.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - lists
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: Signed out.
        '404':
          description: As for GET, and Favourites, which is never renamed or deleted.
  /api/lists/favourites/saved/:
    post:
      operationId: lists_favourites_saved_create
      description: Saves a recipe to Favourites as a link, never a copy (201), or
        answers the save it already has (200).
      tags:
      - lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRecipe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaveRecipe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaveRecipe'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRecipe'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRecipe'
          description: ''
        '400':
          description: No recipe slug was sent.
        '403':
          description: Signed out.
        '404':
          description: 'No recipe has this slug that the account can see: there''s
            none, or it''s another household''s private recipe.'
  /api/lists/household/{slug}/:
    get:
      operationId: lists_household_retrieve
      description: One of the signed-in account's household's lists, which every member
        sees and changes, newest saved first. A recipe its author has since made private
        or deleted keeps its place with the title it was saved with and no recipe.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - lists
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedList'
          description: ''
        '403':
          description: Signed out.
        '404':
          description: 'The account has no list with this slug, of its own or its
            household''s: there''s none, it''s been deleted or renamed, or it''s another
            account''s or household''s.'
    patch:
      operationId: lists_household_partial_update
      description: Renames one of the signed-in account's household's lists, which
        every member sees and changes; its slug follows the new name.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedListName'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedListName'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedListName'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedList'
          description: ''
        '400':
          description: The name is missing, too long, "Favourites", or the name of
            another of the owner's lists.
        '403':
          description: Signed out.
        '404':
          description: As for GET, and Favourites, which is never renamed or deleted.
    delete:
      operationId: lists_household_destroy
      description: Deletes one of the signed-in account's household's lists, which
        every member sees and changes. Its recipes stay in Tastebook and in any other
        list.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - lists
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: Signed out.
        '404':
          description: As for GET, and Favourites, which is never renamed or deleted.
  /api/lists/recipes/{slug}/:
    get:
      operationId: lists_recipes_retrieve
      description: Every list the signed-in account sees, as the Lists page orders
        them, with the save that holds this recipe in each.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - lists
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeLists'
          description: ''
        '403':
          description: Signed out.
        '404':
          description: 'No recipe has this slug that the account can see: there''s
            none, or it''s another household''s private recipe.'
    post:
      operationId: lists_recipes_create
      description: Saves this recipe as a link, never a copy, to one of the account's
        lists or its household's, Favourites among them (201), or answers the save
        it already has there (200).
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveToList'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaveToList'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaveToList'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRecipe'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRecipe'
          description: ''
        '400':
          description: No scope or list slug was sent.
        '403':
          description: Signed out.
        '404':
          description: 'No recipe has this slug that the account can see: there''s
            none, or it''s another household''s private recipe. Or the account has
            no list with this scope and slug, of its own or its household''s: it''s
            been deleted or renamed, or it''s another account''s or household''s.'
  /api/lists/saved/{saved_id}/:
    delete:
      operationId: lists_saved_destroy
      description: Takes a saved recipe out of any list the account sees, its own
        or its household's, available or not, and answers a token that puts it back.
      parameters:
      - in: path
        name: saved_id
        schema:
          type: integer
        required: true
      tags:
      - lists
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Undo'
          description: ''
        '403':
          description: Signed out.
        '404':
          description: 'No list the account sees has this saved recipe: it''s been
            taken out already, or its list deleted.'
  /api/lists/saved/restore/:
    post:
      operationId: lists_saved_restore_create
      description: Puts a saved recipe back in its old place, with the token taking
        it out answered.
      tags:
      - lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Undo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Undo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Undo'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRecipe'
          description: ''
        '400':
          description: The token is missing, over an hour old or forged, or its list
            is one the account no longer sees.
        '403':
          description: Signed out.
  /api/photos/:
    post:
      operationId: photos_create
      description: 'Stores a photo for a household''s recipe and gives its address,
        which a recipe''s photo_url takes. Its address is unguessable but not secret:
        anyone who has it can see the photo. 403 when signed out or for an account
        with no household yet.'
      tags:
      - photos
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUpload'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipePhoto'
          description: ''
        '400':
          description: The file is missing, over 10 MB, or not a JPEG, PNG, WebP or
            HEIC.
        '403':
          description: Signed out, or the account has no household yet.
        '503':
          description: The photo store isn't set up here, or didn't answer.
  /api/recipes/:
    get:
      operationId: recipes_list
      parameters:
      - in: query
        name: course
        schema:
          type: array
          items:
            type: string
        description: Recipes with any of these courses, by slug. Unknown slugs are
          dropped; with none left, nothing is filtered.
      - in: query
        name: cuisine
        schema:
          type: array
          items:
            type: string
        description: Recipes with any of these cuisines, by slug. Unknown slugs are
          dropped; with none left, nothing is filtered.
      - in: query
        name: diet
        schema:
          type: array
          items:
            enum:
            - vegetarian
            - vegan
            - gluten_free
            - dairy_free
            type: string
            description: |-
              * `vegetarian` - Vegetarian
              * `vegan` - Vegan
              * `gluten_free` - Gluten-free
              * `dairy_free` - Dairy-free
        description: Recipes with every one of these diet tags, worked out as each
          recipe's diet_tags are. Any other value is a 400.
      - in: query
        name: difficulty
        schema:
          type: array
          items:
            enum:
            - easy
            - medium
            - hard
            type: string
            description: |-
              * `easy` - Easy
              * `medium` - Medium
              * `hard` - Hard
        description: Recipes with any of these difficulties. Any other value is a
          400.
      - in: query
        name: exclude_ingredient
        schema:
          type: array
          items:
            type: string
        description: Recipes with no line, optional or not, using any of these ingredients,
          by slug. Unknown slugs exclude nothing.
      - in: query
        name: include_ingredient
        schema:
          type: array
          items:
            type: string
        description: Recipes with a line, optional or not, using any of these ingredients
          (every one with include_match=all), by slug. Unknown slugs are dropped;
          with none left, nothing is filtered.
      - in: query
        name: include_match
        schema:
          enum:
          - any
          - all
          type: string
          default: any
          minLength: 1
        description: |-
          any (or missing) means a recipe needs one of the include_ingredient ingredients; all means it needs every one of them. Any other value is a 400.

          * `any` - any
          * `all` - all
      - in: query
        name: max_cook
        schema:
          type: integer
          minimum: 1
        description: Cook time is this many minutes or fewer. A value that is not
          a whole number of at least 1 is a 400.
      - in: query
        name: max_prep
        schema:
          type: integer
          minimum: 1
        description: Prep time is this many minutes or fewer. A value that is not
          a whole number of at least 1 is a 400.
      - in: query
        name: max_total
        schema:
          type: integer
          minimum: 1
        description: Prep plus cook plus extra time is this many minutes or fewer.
          A value that is not a whole number of at least 1 is a 400.
      - in: query
        name: one_pot
        schema:
          type: boolean
          default: false
        description: true means only one-pot recipes; false or missing means every
          recipe.
      - in: query
        name: q
        schema:
          type: string
          default: ''
        description: Title, description, an ingredient's name or synonym, or a cuisine
          contains this text, ignoring case and accents. Title matches come first,
          then the others, alphabetically within each.
      tags:
      - recipes
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeSummary'
          description: ''
        '400':
          description: A difficulty, a diet, an include_match or a time limit is not
            one the list accepts.
    post:
      operationId: recipes_create
      description: Adds a private recipe to the signed-in account's household. Only
        the title is required. 403 when signed out or for an account with no household
        yet.
      tags:
      - recipes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRecipe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewRecipe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewRecipe'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '400':
          description: A field, or a pair of them, is not one a recipe can hold.
        '403':
          description: Signed out, or the account has no household yet.
  /api/recipes/{slug}/:
    get:
      operationId: recipes_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '404':
          description: No recipe has this slug, or it's another household's.
    patch:
      operationId: recipes_partial_update
      description: 'Edits a recipe of the signed-in account''s household: any member
        may edit a private recipe, only its author a public one. Only the fields sent
        change, and the address stays as it is. Sending ingredient_lines or ingredient_groups
        replaces every line and group; the one left out counts as none. Sending steps
        replaces every step.'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRecipeChanges'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRecipeChanges'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRecipeChanges'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '400':
          description: A field, or a pair of them, is not one a recipe can hold.
        '403':
          description: Signed out, or the account has no household yet.
        '404':
          description: 'No recipe has this slug in the account''s household: there''s
            none, it''s another household''s, it''s a catalogue recipe, or it''s public
            and another member wrote it.'
    delete:
      operationId: recipes_destroy
      description: Deletes a recipe of the signed-in account's household, with its
        ingredients and method. Only its author may, or any member once the author
        has left the household.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: Signed out, or the account has no household yet.
        '404':
          description: 'No recipe has this slug that the account may delete: there''s
            none, it''s another household''s or a catalogue recipe, or another member
            wrote it and is still in the household.'
  /api/recipes/{slug}/copy/:
    post:
      operationId: recipes_copy_create
      description: 'Makes a private copy of a recipe the signed-in account can see,
        in its household: written by it, with the original''s title, details, ingredients,
        method and photo, and linked to the original.'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '403':
          description: Signed out, or the account has no household yet.
        '404':
          description: No recipe has this slug, or it's another household's private
            recipe.
  /api/recipes/{slug}/report/:
    post:
      operationId: recipes_report_create
      description: Reports another household's public recipe to staff, once per account.
        The first report hides it from everyone but its author until staff review
        it; once staff have restored it, later reports leave it up.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewReport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewReport'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportOutcome'
          description: ''
        '400':
          description: The reason isn't one a report takes, the note is over 500 characters,
            or the account has reported this recipe already.
        '403':
          description: Signed out.
        '404':
          description: 'No recipe has this slug that the account may report: there''s
            none, it''s private, a catalogue recipe or its own household''s, or a
            report hides it.'
  /api/recipes/{slug}/share-link/:
    put:
      operationId: recipes_share_link_update
      description: Turns on a share link to a private recipe of the signed-in account's
        household, which anyone with its address can open without signing in. Only
        its author may. A link already on stays as it is; one turned on again after
        being turned off has a new address.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '400':
          description: The recipe is public, so anyone can open it already, waiting
            for review, so it will be, or removed by staff.
        '403':
          description: Signed out, or the account has no household yet.
        '404':
          description: 'No recipe has this slug that the account may share: there''s
            none, it''s another household''s or a catalogue recipe, or another member
            wrote it.'
    delete:
      operationId: recipes_share_link_destroy
      description: Turns off a recipe's share link, so its address shows nothing.
        Only its author may. A recipe with no link stays as it is.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '403':
          description: Signed out, or the account has no household yet.
        '404':
          description: 'No recipe has this slug that the account may share: there''s
            none, it''s another household''s or a catalogue recipe, or another member
            wrote it.'
  /api/recipes/{slug}/visibility/:
    put:
      operationId: recipes_visibility_update
      description: 'Makes a recipe of the signed-in account''s household public or
        private. Only its author may. Once they have made 3 others public today, it
        waits for review instead (waiting_for_review): it stays private until staff
        approve it, asking again changes nothing, and making it private withdraws
        it. Asking for the visibility it already has changes nothing.'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeVisibility'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecipeVisibility'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecipeVisibility'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '400':
          description: 'The visibility isn''t public or private, or the recipe lacks
            something a public recipe needs: ingredients, a method, prep and cook
            times, servings or a yield.'
        '403':
          description: Signed out, or the account has no household yet.
        '404':
          description: 'No recipe has this slug that the account may publish: there''s
            none, it''s another household''s or a catalogue recipe, or another member
            wrote it.'
  /api/shared/{token}/:
    get:
      operationId: shared_recipes_retrieve
      description: 'The recipe a share link opens, for anyone with its token, signed
        in or not: the recipe and none of its household''s details. Both answers ask
        search engines not to index them.'
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - shared
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedRecipe'
          description: ''
        '404':
          description: 'No share link has this token: it was turned off, or never
            was.'
  /api/test-accounts/code/:
    get:
      operationId: test_account_code_retrieve
      description: The latest sign-in code of a test account at tastebook.test. Local
        runs and previews only; 404 on production.
      parameters:
      - in: query
        name: email
        schema:
          type: string
        required: true
      tags:
      - test-accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInCode'
          description: ''
        '404':
          description: No response body
  /api/test-accounts/seed/:
    post:
      operationId: test_account_seed_create
      description: Makes test accounts at tastebook.test in new households, with the
        private recipes each wrote, and answers a signed-in session for each. Local
        runs and previews only; 404 on production.
      tags:
      - test-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Seed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Seed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Seed'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seeded'
          description: ''
        '400':
          description: A field, a repeated key, or a recipe the database cannot hold;
            nothing is saved.
        '404':
          description: No response body
components:
  schemas:
    Account:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        unit_system:
          $ref: '#/components/schemas/UnitSystem'
      required:
      - email
      - name
      - unit_system
    BlankEnum:
      enum:
      - ''
    Course:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - name
      - slug
    Cuisine:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - name
      - slug
    CurrentAccount:
      type: object
      properties:
        account:
          allOf:
          - $ref: '#/components/schemas/Account'
          nullable: true
      required:
      - account
    DatabaseEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    DietTag:
      enum:
      - vegetarian
      - vegan
      - gluten_free
      - dairy_free
      type: string
      description: |-
        * `vegetarian` - Vegetarian
        * `vegan` - Vegan
        * `gluten_free` - Gluten-free
        * `dairy_free` - Dairy-free
    DietTagConflict:
      type: object
      properties:
        ingredient:
          allOf:
          - $ref: '#/components/schemas/Ingredient'
          readOnly: true
        diet_tags:
          type: array
          items:
            $ref: '#/components/schemas/DietTag'
          readOnly: true
      required:
      - diet_tags
      - ingredient
    DifficultyEnum:
      enum:
      - easy
      - medium
      - hard
      type: string
      description: |-
        * `easy` - Easy
        * `medium` - Medium
        * `hard` - Hard
    Equipment:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - name
      - slug
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        database:
          $ref: '#/components/schemas/DatabaseEnum'
        version:
          type: string
      required:
      - database
      - status
      - version
    HealthStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    Household:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        invite:
          allOf:
          - $ref: '#/components/schemas/Invite'
          nullable: true
      required:
      - id
      - invite
      - members
      - name
    Ingredient:
      type: object
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: 'The UK name: courgette, coriander, plain flour.'
          maxLength: 100
        grams_per_cup:
          type: integer
          readOnly: true
          nullable: true
        awaiting_review:
          type: boolean
          readOnly: true
      required:
      - awaiting_review
      - grams_per_cup
      - name
      - slug
    IngredientGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: '"For the sauce", "To serve".'
          maxLength: 100
        lines:
          type: array
          items:
            $ref: '#/components/schemas/IngredientLine'
          readOnly: true
      required:
      - id
      - lines
      - name
    IngredientLine:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        amount:
          type: number
          format: double
          maximum: 100000
          minimum: -100000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        amount_max:
          type: number
          format: double
          maximum: 100000
          minimum: -100000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        unit:
          description: |-
            Leave empty for "2 eggs".

            * `g` - g
            * `kg` - kg
            * `ml` - ml
            * `l` - l
            * `tsp` - tsp
            * `tbsp` - tbsp
            * `cup` - cup
            * `oz` - oz
            * `lb` - lb
            * `fl_oz` - fl oz
            * `pinch` - pinch
            * `clove` - clove
            * `tin` - tin
            * `slice` - slice
            * `bunch` - bunch
            * `handful` - handful
          oneOf:
          - $ref: '#/components/schemas/UnitEnum'
          - $ref: '#/components/schemas/BlankEnum'
        ingredient:
          allOf:
          - $ref: '#/components/schemas/Ingredient'
          readOnly: true
        note:
          type: string
          description: '"finely chopped".'
          maxLength: 200
        optional:
          type: boolean
        original_text:
          type: string
          title: Original wording
          description: The line as the recipe was written.
          maxLength: 300
      required:
      - amount
      - amount_max
      - id
      - ingredient
      - note
      - optional
      - original_text
      - unit
    IngredientOption:
      type: object
      description: An ingredient as the filters offer it, with the synonyms it can
        be found by.
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: 'The UK name: courgette, coriander, plain flour.'
          maxLength: 100
        synonyms:
          type: array
          items:
            type: string
            description: 'Another name, such as the US one: zucchini.'
          readOnly: true
      required:
      - name
      - slug
      - synonyms
    Invite:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/InviteStatus'
      required:
      - expires_at
      - status
      - token
    InviteStatus:
      enum:
      - live
      - expired
      - cancelled
      type: string
      description: |-
        * `live` - Live
        * `expired` - Expired
        * `cancelled` - Cancelled
    InvitedHousehold:
      type: object
      properties:
        name:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
      required:
      - members
      - name
    JoinInvite:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/InviteStatus'
        is_member:
          type: boolean
        household:
          allOf:
          - $ref: '#/components/schemas/InvitedHousehold'
          nullable: true
        recipes_to_copy:
          type: integer
          description: How many private recipes the viewer wrote in their household
            and would take a copy of by joining. 0 when the link offers them no household
            to join.
      required:
      - household
      - is_member
      - recipes_to_copy
      - status
    ListCover:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        photo:
          allOf:
          - $ref: '#/components/schemas/ListedPhoto'
          readOnly: true
          nullable: true
      required:
      - id
      - photo
    ListPlace:
      type: object
      properties:
        slug:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          readOnly: true
          description: |-
            personal: only its owner sees it. household: everyone in the household sees and changes it.

            * `personal` - Just you
            * `household` - Household
        recipe_count:
          type: integer
          readOnly: true
          description: Unavailable recipes count too.
        saved_id:
          type: integer
          readOnly: true
          nullable: true
          description: The id of the save that holds the recipe in this list, which
            unsaving takes; null when it doesn't.
      required:
      - name
      - recipe_count
      - saved_id
      - scope
      - slug
    ListSummary:
      type: object
      properties:
        slug:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          readOnly: true
          description: |-
            personal: only its owner sees it. household: everyone in the household sees and changes it.

            * `personal` - Just you
            * `household` - Household
        recipe_count:
          type: integer
          readOnly: true
          description: Unavailable recipes count too.
        covers:
          type: array
          items:
            $ref: '#/components/schemas/ListCover'
          readOnly: true
          description: Up to three of the list's newest available recipes, for its
            fan.
      required:
      - covers
      - name
      - recipe_count
      - scope
      - slug
    ListedCuisine:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - name
      - slug
    ListedPhoto:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        thumbnails:
          type: array
          items:
            $ref: '#/components/schemas/ListedPhotoThumbnail'
          readOnly: true
        credit:
          allOf:
          - $ref: '#/components/schemas/ListedPhotoCredit'
          readOnly: true
          nullable: true
      required:
      - credit
      - thumbnails
      - url
    ListedPhotoCredit:
      type: object
      properties:
        author:
          type: string
          readOnly: true
        licence:
          type: string
          readOnly: true
        source_url:
          type: string
          format: uri
          readOnly: true
      required:
      - author
      - licence
      - source_url
    ListedPhotoThumbnail:
      type: object
      properties:
        width:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
      required:
      - url
      - width
    ListedRecipe:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        visibility:
          allOf:
          - $ref: '#/components/schemas/Visibility'
          readOnly: true
        author:
          type: string
          nullable: true
          readOnly: true
          description: The name of whoever wrote a public household recipe; null for
            a private or catalogue recipe.
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 300
        cuisines:
          type: array
          items:
            $ref: '#/components/schemas/ListedCuisine'
          readOnly: true
        difficulty:
          oneOf:
          - $ref: '#/components/schemas/DifficultyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        total_minutes:
          type: integer
          readOnly: true
          nullable: true
        photo:
          allOf:
          - $ref: '#/components/schemas/ListedPhoto'
          readOnly: true
          nullable: true
        diet_tags:
          type: array
          items:
            $ref: '#/components/schemas/DietTag'
          readOnly: true
        hidden_for_review:
          type: boolean
          readOnly: true
          description: Whether a report hides this recipe from everyone but its author,
            who alone is sent it until staff review it.
        waiting_for_review:
          type: boolean
          readOnly: true
          description: Whether its author asked to make this recipe public after making
            3 others public that day, so it stays private until staff approve it.
      required:
      - author
      - cuisines
      - description
      - diet_tags
      - difficulty
      - hidden_for_review
      - id
      - photo
      - slug
      - title
      - total_minutes
      - visibility
      - waiting_for_review
    Lists:
      type: object
      properties:
        household_name:
          type: string
          readOnly: true
          nullable: true
          description: The account's household's name; null before it has one.
        household_members:
          type: integer
          readOnly: true
          description: How many accounts are in the household, the signed-in one included;
            0 before it has one.
        lists:
          type: array
          items:
            $ref: '#/components/schemas/ListSummary'
          readOnly: true
          description: Favourites, then the account's own lists by name, then its
            household's by name.
      required:
      - household_members
      - household_name
      - lists
    Member:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_you:
          type: boolean
      required:
      - id
      - is_you
      - name
    NewIngredient:
      type: object
      description: The name of an ingredient someone adds from the recipe form.
