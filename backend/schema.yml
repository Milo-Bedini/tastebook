openapi: 3.0.3
info:
  title: Tastebook API
  version: 0.1.0
  description: Recipe hub API
paths:
  /api/account/:
    get:
      operationId: current_account_retrieve
      description: The account signed in on this browser, or null when nobody is.
      tags:
      - account
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccount'
          description: ''
    patch:
      operationId: current_account_partial_update
      description: Saves the signed-in account's name, unit system or both. An account
        with no household gets one called "<name>'s household"; a later name leaves
        the household's name as it is.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountChanges'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountChanges'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountChanges'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '400':
          description: No response body
        '403':
          description: No response body
  /api/courses/:
    get:
      operationId: courses_list
      tags:
      - courses
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
          description: ''
  /api/cuisines/:
    get:
      operationId: cuisines_list
      tags:
      - cuisines
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cuisine'
          description: ''
  /api/equipment/:
    get:
      operationId: equipment_list
      tags:
      - equipment
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Equipment'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/household/:
    get:
      operationId: household_retrieve
      description: 'The signed-in account''s household: its name and its members,
        the account first. 404 for an account with no household yet.'
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
    patch:
      operationId: household_partial_update
      description: Renames the signed-in account's household. Any member may.
      tags:
      - household
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdChanges'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdChanges'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdChanges'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '400':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/household/invite/:
    post:
      operationId: household_invite_create
      description: 'The signed-in account''s household with a live invite link: the
        one it has, or a new one that works for 7 days when it has none or only an
        expired one. Any member may.'
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
    delete:
      operationId: household_invite_destroy
      description: Cancels the signed-in account's household's invite link, live or
        expired, and answers the household. Any member may; cancelling when there
        is none does nothing.
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
  /api/household/leave/:
    post:
      operationId: household_leave_create
      description: Moves the signed-in account into a new household of one, named
        after it, with a copy of each private recipe it wrote; the household it left
        keeps its own. A household left with nobody in it is deleted.
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
  /api/household/members/{member_id}/:
    delete:
      operationId: household_members_destroy
      description: Removes another member of the signed-in account's household into
        a new household of one, with a copy of each private recipe they wrote (the
        household keeps its own), and emails them. Any member may. 404 for anyone
        who isn't another member of it.
      parameters:
      - in: path
        name: member_id
        schema:
          type: integer
        required: true
      tags:
      - household
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
  /api/ingredients/:
    get:
      operationId: ingredients_list
      description: Every ingredient but those awaiting review; a household is also
        offered the ones its recipes use.
      tags:
      - ingredients
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngredientOption'
          description: ''
    post:
      operationId: ingredients_create
      description: Gives the ingredient with this name or synonym, ignoring case and
        accents (200), or adds one awaiting review (201). 403 when signed out or for
        an account with no household yet.
      tags:
      - ingredients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewIngredient'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewIngredient'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewIngredient'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientOption'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientOption'
          description: ''
        '400':
          description: The name is blank, has no letter or is over 100 characters.
        '403':
          description: Signed out, or the account has no household yet.
  /api/invites/{token}/:
    get:
      operationId: invite_retrieve
      description: Whether an invite link works and, for someone signed in, the household
        it joins. 404 for a token that was never an invite.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - invites
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinInvite'
          description: ''
        '404':
          description: No response body
  /api/invites/{token}/join/:
    post:
      operationId: invite_join_create
      description: Moves the signed-in account into the invite's household with a
        copy of each private recipe it wrote; the household it left keeps its own,
        and is deleted if nobody is left in it. 404 for an unknown token, 409 when
        the link is cancelled or expired.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - invites
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/lists/:
    get:
      operationId: lists_list
      description: 'The signed-in account''s lists: Favourites, even before anything
        is saved to it.'
      tags:
      - lists
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListSummary'
          description: ''
        '403':
          description: Signed out.
  /api/lists/favourites/:
    get:
      operationId: lists_favourites_retrieve
      description: The signed-in account's Favourites, newest saved first. A recipe
        its author has since made private or deleted keeps its place with the title
        it was saved with and no recipe.
      tags:
      - lists
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedList'
          description: ''
        '403':
          description: Signed out.
  /api/lists/favourites/saved/:
    post:
      operationId: lists_favourites_saved_create
      description: Saves a recipe to Favourites as a link, never a copy (201), or
        answers the save it already has (200).
      tags:
      - lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRecipe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaveRecipe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaveRecipe'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRecipe'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRecipe'
          description: ''
        '400':
          description: No recipe slug was sent.
        '403':
          description: Signed out.
        '404':
          description: 'No recipe has this slug that the account can see: there''s
            none, or it''s another household''s private recipe.'
  /api/lists/favourites/saved/{saved_id}/:
    delete:
      operationId: lists_favourites_saved_destroy
      description: Takes a saved recipe out of Favourites, available or not, and answers
        a token that puts it back.
      parameters:
      - in: path
        name: saved_id
        schema:
          type: integer
        required: true
      tags:
      - lists
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Undo'
          description: ''
        '403':
          description: Signed out.
        '404':
          description: 'The account has no such saved recipe: it''s been taken out
            already.'
  /api/lists/favourites/saved/restore/:
    post:
      operationId: lists_favourites_saved_restore_create
      description: Puts a saved recipe back in its old place, with the token taking
        it out answered.
      tags:
      - lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Undo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Undo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Undo'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRecipe'
          description: ''
        '400':
          description: The token is missing, over an hour old, forged or another account's.
        '403':
          description: Signed out.
  /api/photos/:
    post:
      operationId: photos_create
      description: 'Stores a photo for a household''s recipe and gives its address,
        which a recipe''s photo_url takes. Its address is unguessable but not secret:
        anyone who has it can see the photo. 403 when signed out or for an account
        with no household yet.'
      tags:
      - photos
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUpload'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipePhoto'
          description: ''
        '400':
          description: The file is missing, over 10 MB, or not a JPEG, PNG, WebP or
            HEIC.
        '403':
          description: Signed out, or the account has no household yet.
        '503':
          description: The photo store isn't set up here, or didn't answer.
  /api/recipes/:
    get:
      operationId: recipes_list
      parameters:
      - in: query
        name: course
        schema:
          type: array
          items:
            type: string
        description: Recipes with any of these courses, by slug. Unknown slugs are
          dropped; with none left, nothing is filtered.
      - in: query
        name: cuisine
        schema:
          type: array
          items:
            type: string
        description: Recipes with any of these cuisines, by slug. Unknown slugs are
          dropped; with none left, nothing is filtered.
      - in: query
        name: diet
        schema:
          type: array
          items:
            enum:
            - vegetarian
            - vegan
            - gluten_free
            - dairy_free
            type: string
            description: |-
              * `vegetarian` - Vegetarian
              * `vegan` - Vegan
              * `gluten_free` - Gluten-free
              * `dairy_free` - Dairy-free
        description: Recipes with every one of these diet tags, worked out as each
          recipe's diet_tags are. Any other value is a 400.
      - in: query
        name: difficulty
        schema:
          type: array
          items:
            enum:
            - easy
            - medium
            - hard
            type: string
            description: |-
              * `easy` - Easy
              * `medium` - Medium
              * `hard` - Hard
        description: Recipes with any of these difficulties. Any other value is a
          400.
      - in: query
        name: exclude_ingredient
        schema:
          type: array
          items:
            type: string
        description: Recipes with no line, optional or not, using any of these ingredients,
          by slug. Unknown slugs exclude nothing.
      - in: query
        name: include_ingredient
        schema:
          type: array
          items:
            type: string
        description: Recipes with a line, optional or not, using any of these ingredients
          (every one with include_match=all), by slug. Unknown slugs are dropped;
          with none left, nothing is filtered.
      - in: query
        name: include_match
        schema:
          enum:
          - any
          - all
          type: string
          default: any
          minLength: 1
        description: |-
          any (or missing) means a recipe needs one of the include_ingredient ingredients; all means it needs every one of them. Any other value is a 400.

          * `any` - any
          * `all` - all
      - in: query
        name: max_cook
        schema:
          type: integer
          minimum: 1
        description: Cook time is this many minutes or fewer. A value that is not
          a whole number of at least 1 is a 400.
      - in: query
        name: max_prep
        schema:
          type: integer
          minimum: 1
        description: Prep time is this many minutes or fewer. A value that is not
          a whole number of at least 1 is a 400.
      - in: query
        name: max_total
        schema:
          type: integer
          minimum: 1
        description: Prep plus cook plus extra time is this many minutes or fewer.
          A value that is not a whole number of at least 1 is a 400.
      - in: query
        name: one_pot
        schema:
          type: boolean
          default: false
        description: true means only one-pot recipes; false or missing means every
          recipe.
      - in: query
        name: q
        schema:
          type: string
          default: ''
        description: Title, description, an ingredient's name or synonym, or a cuisine
          contains this text, ignoring case and accents. Title matches come first,
          then the others, alphabetically within each.
      tags:
      - recipes
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeSummary'
          description: ''
        '400':
          description: A difficulty, a diet, an include_match or a time limit is not
            one the list accepts.
    post:
      operationId: recipes_create
      description: Adds a private recipe to the signed-in account's household. Only
        the title is required. 403 when signed out or for an account with no household
        yet.
      tags:
      - recipes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRecipe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewRecipe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewRecipe'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '400':
          description: A field, or a pair of them, is not one a recipe can hold.
        '403':
          description: Signed out, or the account has no household yet.
  /api/recipes/{slug}/:
    get:
      operationId: recipes_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '404':
          description: No recipe has this slug, or it's another household's.
    patch:
      operationId: recipes_partial_update
      description: 'Edits a recipe of the signed-in account''s household: any member
        may edit a private recipe, only its author a public one. Only the fields sent
        change, and the address stays as it is. Sending ingredient_lines or ingredient_groups
        replaces every line and group; the one left out counts as none. Sending steps
        replaces every step.'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRecipeChanges'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRecipeChanges'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRecipeChanges'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '400':
          description: A field, or a pair of them, is not one a recipe can hold.
        '403':
          description: Signed out, or the account has no household yet.
        '404':
          description: 'No recipe has this slug in the account''s household: there''s
            none, it''s another household''s, it''s a catalogue recipe, or it''s public
            and another member wrote it.'
    delete:
      operationId: recipes_destroy
      description: Deletes a recipe of the signed-in account's household, with its
        ingredients and method. Only its author may, or any member once the author
        has left the household.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: Signed out, or the account has no household yet.
        '404':
          description: 'No recipe has this slug that the account may delete: there''s
            none, it''s another household''s or a catalogue recipe, or another member
            wrote it and is still in the household.'
  /api/recipes/{slug}/visibility/:
    put:
      operationId: recipes_visibility_update
      description: Makes a recipe of the signed-in account's household public or private.
        Only its author may. Asking for the visibility it already has changes nothing.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - recipes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeVisibility'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecipeVisibility'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecipeVisibility'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          description: ''
        '400':
          description: 'The visibility isn''t public or private, or the recipe lacks
            something a public recipe needs: ingredients, a method, prep and cook
            times, servings or a yield.'
        '403':
          description: Signed out, or the account has no household yet.
        '404':
          description: 'No recipe has this slug that the account may publish: there''s
            none, it''s another household''s or a catalogue recipe, or another member
            wrote it.'
  /api/test-accounts/code/:
    get:
      operationId: test_account_code_retrieve
      description: The latest sign-in code of a test account at tastebook.test. Local
        runs and previews only; 404 on production.
      parameters:
      - in: query
        name: email
        schema:
          type: string
        required: true
      tags:
      - test-accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInCode'
          description: ''
        '404':
          description: No response body
  /api/test-accounts/seed/:
    post:
      operationId: test_account_seed_create
      description: Makes test accounts at tastebook.test in new households, with the
        private recipes each wrote, and answers a signed-in session for each. Local
        runs and previews only; 404 on production.
      tags:
      - test-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Seed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Seed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Seed'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seeded'
          description: ''
        '400':
          description: A field, a repeated key, or a recipe the database cannot hold;
            nothing is saved.
        '404':
          description: No response body
components:
  schemas:
    Account:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        unit_system:
          $ref: '#/components/schemas/UnitSystem'
      required:
      - email
      - name
      - unit_system
    BlankEnum:
      enum:
      - ''
    Course:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - name
      - slug
    Cuisine:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - name
      - slug
