[project]
name = "tastebook-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "django-allauth[headless,mfa,socialaccount]>=65.21.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "sentry-sdk[django]>=2.73.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mutmut>=3.8.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-env>=1.8.1",
    "responses>=0.26.3",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
env = ["D:DJANGO_SECRET_KEY=test-only-secret-key"]
# A deprecated Django setting or call fails the tests with its warning, rather than warning on every start.
filterwarnings = [
    "error::django.utils.deprecation.RemovedInNextVersionWarning",
    "error::django.utils.deprecation.RemovedAfterNextVersionWarning",
]

# The area rules in AGENTS.md (Domain areas). config wires the areas' views into URLs, so it's no area's caller.
# A new area joins root_packages and the contracts below when it's added: import-linter refuses a missing package.
[tool.importlinter]
root_packages = ["config", "health", "households", "recipe_collections", "recipes", "seed"]

[[tool.importlinter.contracts]]
name = "An area reaches another only through its services, models (and their querysets) and signals"
type = "forbidden"
source_modules = ["health", "households", "recipe_collections", "recipes", "seed"]
forbidden_modules = ["health.*", "households.*", "recipe_collections.*", "recipes.*"]
ignore_imports = ["** -> *.services", "** -> *.models", "** -> *.signals"]
# The public modules import their own area's private ones: only a direct import crosses the boundary.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "households depends on no other area"
type = "forbidden"
source_modules = ["households"]
forbidden_modules = ["health", "recipe_collections", "recipes"]

[[tool.importlinter.contracts]]
name = "recipes depends on no area but households"
type = "forbidden"
source_modules = ["recipes"]
forbidden_modules = ["health", "recipe_collections"]

[[tool.importlinter.contracts]]
name = "seed is imported by nothing"
type = "protected"
protected_modules = ["seed"]
allowed_importers = []

[tool.vercel.scripts]
# Runs after the dependencies install and before the deployment goes live: each deployment migrates its own database.
build = "python build.py"

[tool.uv]
# Ignore releases less than a day old, as pnpm does by default: most compromised releases are pulled within hours.
exclude-newer = "1 day"
